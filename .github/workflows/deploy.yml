# Déploiement du hub sur lab.agence-absolu.com, à chaque push sur main.
#
# Même transport que les démos (rsync sur SSH, mot de passe via sshpass) et
# mêmes secrets — voir le README. Deux différences avec le workflow d'une démo :
#
#  1. On n'envoie que les fichiers du hub, sans --delete : lab-projects/ (les
#     démos) vit dans le même dossier et ne doit jamais être touché.
#  2. Node charge server.js au démarrage : le nouveau code ne sert à rien tant
#     que l'application n'a pas redémarré. Infomaniak n'offre pas d'API publique
#     pour ça (le bouton du Manager passe par une API privée), on tue donc le
#     processus par SSH et on laisse le superviseur d'Infomaniak le relancer.
#     Le job vérifie qu'un nouveau PID est apparu ; sinon il échoue et il faut
#     redémarrer depuis le Manager (tableau de bord du site Node.js).
#
# Secrets à créer (Settings › Secrets and variables › Actions) :
#   LAB_SSH_HOST         hôte SSH (…ssh.hosting-ik.com)
#   LAB_SSH_USER         compte SSH
#   LAB_SSH_PASSWORD     mot de passe
#   LAB_SSH_KNOWN_HOSTS  facultatif — sortie de `ssh-keyscan <hôte>`

name: Déploiement hub

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hub
  cancel-in-progress: true

env:
  # Racine du site Node.js, relative au home du compte SSH.
  TARGET: lab.agence-absolu.com

jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Connaître le serveur
        env:
          HOST: ${{ secrets.LAB_SSH_HOST }}
          KNOWN_HOSTS: ${{ secrets.LAB_SSH_KNOWN_HOSTS }}
        run: |
          sudo apt-get install -y --no-install-recommends sshpass
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          if [ -n "$KNOWN_HOSTS" ]; then
            printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -H "$HOST" > ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Envoi vers le lab
        env:
          SSHPASS: ${{ secrets.LAB_SSH_PASSWORD }}
          HOST: ${{ secrets.LAB_SSH_HOST }}
          USER_SSH: ${{ secrets.LAB_SSH_USER }}
        run: |
          sshpass -e ssh "$USER_SSH@$HOST" "mkdir -p '$TARGET'"
          # Liste explicite, pas de --delete : rien d'autre dans ce dossier
          # (lab-projects/ en tête) ne doit être touché.
          sshpass -e rsync -az server.js package.json README.md "$USER_SSH@$HOST:$TARGET/"

      - name: Redémarrer l'application
        env:
          SSHPASS: ${{ secrets.LAB_SSH_PASSWORD }}
          HOST: ${{ secrets.LAB_SSH_HOST }}
          USER_SSH: ${{ secrets.LAB_SSH_USER }}
        run: |
          sshpass -e ssh "$USER_SSH@$HOST" 'bash -s' <<'REMOTE'
            set -u
            # Le motif cible le node du hub, pas le npm qui l'a lancé : npm se
            # termine avec son enfant, et le superviseur relance la commande de
            # démarrage. Les crochets évitent que pgrep se trouve lui-même.
            PATTERN='[n]ode .*server\.js'

            echo "Processus avant :"
            pgrep -af "$PATTERN" || echo "(aucun — l'application est arrêtée ou lancée autrement)"

            OLD=$(pgrep -f "$PATTERN" | sort | tr '\n' ' ')
            pkill -f "$PATTERN" || true

            for i in $(seq 1 12); do
              sleep 5
              NEW=$(pgrep -f "$PATTERN" | sort | tr '\n' ' ')
              if [ -n "$NEW" ] && [ "$NEW" != "$OLD" ]; then
                echo "Redémarré : PID $NEW"
                exit 0
              fi
            done

            echo "::error::L'application n'est pas revenue en 60 s. Redémarrer depuis le Manager Infomaniak (site Node.js › tableau de bord)."
            exit 1
          REMOTE
